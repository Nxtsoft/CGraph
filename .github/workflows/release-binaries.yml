name: release-binaries

# Builds the release-preset binaries and attaches them to a GitHub release,
# so consumers (CI test selection, agent hosts) can download cgraph instead
# of building from source.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: release tag to create or upload to (e.g. bin-v0.1.0)
        required: true

permissions:
  contents: write

jobs:
  build-upload:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    env:
      VCPKG_OVERLAY_TRIPLETS: ${{ github.workspace }}/triplets
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux-x64
          - os: ubuntu-24.04-arm
            platform: linux-arm64
          - os: macos-latest
            platform: macos-arm64
          # GitHub's last x86_64 macOS image; Intel runners end with it (fall 2027).
          - os: macos-15-intel
            platform: macos-x64
          # MSVC, static vcpkg deps against the dynamic CRT (x64-windows-static-md),
          # so the four .exe files need nothing beyond the OS.
          - os: windows-latest
            platform: windows-x64
            preset: windows-release

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: lukka/get-cmake@latest

      - uses: ilammy/msvc-dev-cmd@v1
        if: runner.os == 'Windows'

      - uses: lukka/run-vcpkg@v11
        with:
          vcpkgJsonGlob: vcpkg.json

      - name: Configure
        run: cmake --preset ${{ matrix.preset || 'release' }}

      - name: Build
        run: cmake --build --preset ${{ matrix.preset || 'release' }}

      # The launcher extracts every platform's asset with `tar -xzf` (bsdtar
      # ships with Windows 10+), so Windows gets a .tar.gz too.
      - name: Package
        shell: bash
        run: scripts/package_release.sh "build/${{ matrix.preset || 'release' }}" "${{ matrix.platform }}"

      - name: Upload to release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release view "${{ inputs.tag }}" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 \
            || gh release create "${{ inputs.tag }}" --repo "$GITHUB_REPOSITORY" \
                 --title "Binaries ${{ inputs.tag }}" \
                 --notes "Prebuilt release binaries (cgraph, graphd, cgraph-client, cgraph-mcp)."
          # No --clobber: launchers pin each asset's SHA-256 (integrations/launcher/
          # release.json), so replacing a published asset would break every install.
          gh release upload "${{ inputs.tag }}" "cgraph-${{ matrix.platform }}.tar.gz" \
            --repo "$GITHUB_REPOSITORY"
