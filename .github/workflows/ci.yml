name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    name: ${{ matrix.os }} / ${{ matrix.preset }}
    runs-on: ${{ matrix.os }}
    env:
      VCPKG_OVERLAY_TRIPLETS: ${{ github.workspace }}/triplets
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        preset: [default, release, sanitizers]
        # Windows x64: MSVC + Ninja with the static-md vcpkg triplet. No
        # sanitizers row: the preset's ASan/UBSan pair is GCC/Clang-only.
        include:
          - os: windows-latest
            preset: windows-default
          - os: windows-latest
            preset: windows-release

    steps:
      # Fixtures and goldens are compared byte for byte; Git for Windows
      # would otherwise check text files out with CRLF line endings.
      - name: Keep LF line endings
        if: runner.os == 'Windows'
        run: git config --global core.autocrlf false

      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: lukka/get-cmake@latest

      # Puts cl.exe and the Windows SDK on PATH for the Ninja generator.
      - uses: ilammy/msvc-dev-cmd@v1
        if: runner.os == 'Windows'

      - uses: lukka/run-vcpkg@v11
        with:
          vcpkgJsonGlob: vcpkg.json

      - name: Configure
        run: cmake --preset ${{ matrix.preset }}

      - name: Build
        run: cmake --build --preset ${{ matrix.preset }}

      # The windows-x64 release asset, built exactly as release-binaries.yml
      # packages it, so a PR proves the asset builds without cutting a release.
      - name: Package windows-x64 asset
        if: matrix.preset == 'windows-release'
        shell: bash
        run: scripts/package_release.sh build/windows-release windows-x64

      - uses: actions/upload-artifact@v4
        if: matrix.preset == 'windows-release'
        with:
          name: cgraph-windows-x64
          path: cgraph-windows-x64.tar.gz

      - name: Test
        run: ctest --preset ${{ matrix.preset }}

  launcher:
    name: ${{ matrix.os }} / launcher
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Downloads the pinned release through the plugin/npm launcher and checks
      # the checksum, race and refusal paths against the real GitHub release.
      - name: Test launcher
        run: node --test integrations/launcher/cgraph-launch.test.mjs

  fuzz-smoke:
    name: ubuntu-latest / fuzzers
    runs-on: ubuntu-latest
    # The whole job historically finishes in ~12 minutes; without a ceiling a
    # single wedged step blocks a PR for the 6-hour default (observed three
    # times in one day on apt).
    timeout-minutes: 30
    env:
      VCPKG_DEFAULT_TRIPLET: x64-linux-clang
      VCPKG_OVERLAY_TRIPLETS: ${{ github.workspace }}/triplets

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: lukka/get-cmake@latest

      # ubuntu-latest ships a libFuzzer-capable clang; `apt-get update` against
      # the mirrors wedged indefinitely three times on 2026-08-19, each hang
      # eating an hour+ of merge latency. Use the preinstalled toolchain and
      # keep a hard step ceiling so any future environment stall fails fast
      # instead of blocking the PR.
      - name: Verify Clang toolchain
        timeout-minutes: 3
        run: |
          clang --version
          clang++ --version

      - uses: lukka/run-vcpkg@v11
        with:
          vcpkgJsonGlob: vcpkg.json

      - name: Configure fuzzers
        run: cmake --preset fuzzers -DVCPKG_TARGET_TRIPLET=${VCPKG_DEFAULT_TRIPLET}

      - name: Build fuzzers
        run: cmake --build --preset fuzzers

      - name: Run fuzz smoke tests
        run: ctest --preset fuzzers -R 'cgraph_fuzz.*smoke_test'
