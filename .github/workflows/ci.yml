name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    name: ${{ matrix.os }} / ${{ matrix.preset }}
    runs-on: ${{ matrix.os }}
    env:
      VCPKG_OVERLAY_TRIPLETS: ${{ github.workspace }}/triplets
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest]
        preset: [windows-release]
        # Windows x64: MSVC + Ninja with the static-md vcpkg triplet. No
        # sanitizers row: the preset's ASan/UBSan pair is GCC/Clang-only.
        include:
          - os: windows-latest
            preset: windows-default

    steps:
      # Fixtures and goldens are compared byte for byte; Git for Windows
      # would otherwise check text files out with CRLF line endings.
      - name: Keep LF line endings
        if: runner.os == 'Windows'
        run: git config --global core.autocrlf false

      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: lukka/get-cmake@latest

      # Puts cl.exe and the Windows SDK on PATH for the Ninja generator.
      - uses: ilammy/msvc-dev-cmd@v1
        if: runner.os == 'Windows'

      - uses: lukka/run-vcpkg@v11
        with:
          vcpkgJsonGlob: vcpkg.json

      # On Windows vcpkg builds every dependency from source (about 27 minutes,
      # most of it openblas twice), and run-vcpkg's x-gha binary cache restores
      # nothing. Keep vcpkg's own file binary cache between runs instead. Saved
      # right after Configure, so a failing build or test still keeps it.
      - name: Restore vcpkg binary cache
        id: vcpkg-cache
        if: runner.os == 'Windows'
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/vcpkg-bin
          key: vcpkg-bin-${{ runner.os }}-${{ hashFiles('vcpkg.json', 'triplets/**') }}

      - name: Use the vcpkg file binary cache
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force "${{ runner.temp }}/vcpkg-bin" | Out-Null
          "VCPKG_BINARY_SOURCES=clear;files,${{ runner.temp }}/vcpkg-bin,readwrite" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Configure
        run: cmake --preset ${{ matrix.preset }}

      - name: Save vcpkg binary cache
        if: always() && runner.os == 'Windows' && steps.vcpkg-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/vcpkg-bin
          key: vcpkg-bin-${{ runner.os }}-${{ hashFiles('vcpkg.json', 'triplets/**') }}

      - name: Build
        id: build
        run: cmake --build --preset ${{ matrix.preset }}

      - name: Test
        run: ctest --preset ${{ matrix.preset }} -R cgraph_daemon_server_test --repeat until-fail:40 --timeout 180 --output-on-failure

      # The windows-x64 release asset, packaged exactly as release-binaries.yml
      # packages it, so a PR proves the asset builds without cutting a release.
      - name: Package windows-x64 asset
        if: matrix.preset == 'windows-release' && !cancelled() && steps.build.outcome == 'success'
        shell: bash
        run: scripts/package_release.sh build/windows-release windows-x64

      - uses: actions/upload-artifact@v4
        if: matrix.preset == 'windows-release' && !cancelled() && steps.build.outcome == 'success'
        with:
          name: cgraph-windows-x64
          path: cgraph-windows-x64.tar.gz

      # The plugin launcher on Windows, end to end, against that asset. The
      # pinned release has no windows-x64 asset until the next release run, so
      # this job's copy of release.json gains one (the built asset's checksum)
      # and the asset is unpacked, with Windows' own tar.exe, where the launcher
      # caches the pinned release. Then launcher -> cgraph-mcp.exe, which
      # auto-spawns graphd.exe and answers graph_query over AF_UNIX.
      - name: Launcher E2E (windows-x64 asset)
        if: matrix.preset == 'windows-release' && !cancelled() && steps.build.outcome == 'success'
        shell: pwsh
        run: |
          $sha = (Get-FileHash cgraph-windows-x64.tar.gz -Algorithm SHA256).Hash.ToLower()
          node -e "const f='integrations/launcher/release.json'; const r=JSON.parse(require('fs').readFileSync(f)); r.assets['windows-x64']={name:'cgraph-windows-x64.tar.gz',sha256:process.argv[1]}; require('fs').writeFileSync(f, JSON.stringify(r, null, 2));" $sha
          $tag = node -p "require('./integrations/launcher/release.json').tag"
          $env:CGRAPH_CACHE_DIR = Join-Path $env:RUNNER_TEMP 'cgraph-cache'
          $dir = Join-Path $env:CGRAPH_CACHE_DIR "$tag\windows-x64"
          New-Item -ItemType Directory -Force $dir | Out-Null
          & "$env:SystemRoot\System32\tar.exe" -xzf cgraph-windows-x64.tar.gz -C $dir
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $root = Join-Path $env:RUNNER_TEMP 'mcp-root'
          Copy-Item -Recurse tests/fixtures/one_shot $root
          node scripts/mcp_smoke.mjs $root node integrations/launcher/cgraph-launch.mjs cgraph-mcp

  launcher:
    name: ${{ matrix.os }} / launcher
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Downloads the pinned release through the plugin/npm launcher and checks
      # the checksum, race and refusal paths against the real GitHub release.
      - name: Test launcher
        run: node --test integrations/launcher/cgraph-launch.test.mjs

  fuzz-smoke:
    name: ubuntu-latest / fuzzers
    runs-on: ubuntu-latest
    # The whole job historically finishes in ~12 minutes; without a ceiling a
    # single wedged step blocks a PR for the 6-hour default (observed three
    # times in one day on apt).
    timeout-minutes: 30
    env:
      VCPKG_DEFAULT_TRIPLET: x64-linux-clang
      VCPKG_OVERLAY_TRIPLETS: ${{ github.workspace }}/triplets

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: lukka/get-cmake@latest

      # ubuntu-latest ships a libFuzzer-capable clang; `apt-get update` against
      # the mirrors wedged indefinitely three times on 2026-08-19, each hang
      # eating an hour+ of merge latency. Use the preinstalled toolchain and
      # keep a hard step ceiling so any future environment stall fails fast
      # instead of blocking the PR.
      - name: Verify Clang toolchain
        timeout-minutes: 3
        run: |
          clang --version
          clang++ --version

      - uses: lukka/run-vcpkg@v11
        with:
          vcpkgJsonGlob: vcpkg.json

      - name: Configure fuzzers
        run: cmake --preset fuzzers -DVCPKG_TARGET_TRIPLET=${VCPKG_DEFAULT_TRIPLET}

      - name: Build fuzzers
        run: cmake --build --preset fuzzers

      - name: Run fuzz smoke tests
        run: ctest --preset fuzzers -R 'cgraph_fuzz.*smoke_test'
