name: publish-mcp-registry

# Publishes server.json to the official MCP registry as io.github.Nxtsoft/cgraph.
# GitHub OIDC proves the run belongs to the Nxtsoft org, so no token is stored.
# The npm package named in server.json must already be published at that version.
on:
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Install mcp-publisher
        run: |
          curl -fsSL "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_linux_amd64.tar.gz" | tar xz mcp-publisher

      - name: Check the npm package exists at the server.json version
        run: |
          version=$(jq -r '.packages[0].version' server.json)
          npm view "cgraph-mcp@${version}" version

      - name: Authenticate to the MCP registry
        run: ./mcp-publisher login github-oidc

      - name: Publish server.json
        run: ./mcp-publisher publish
